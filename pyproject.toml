[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-ani"
version = "3.1.0"
description = "Anime-inspired YouTube downloader TUI"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]",
  "yt-dlp-ejs",
  "term-image>=0.7,<0.8",
  "imageio-ffmpeg>=0.5",
]

[project.scripts]
yt-ani = "yt_ani.cli:main"

[tool.setuptools]
include-package-data = true
packages = ["yt_ani", "yt_ani.ui", "yt_ani.assets"]

[tool.setuptools.package-data]
"yt_ani.assets" = ["*.png"]
